# MS41.3 — community custom firmware ("SS1v2" / openms41 lineage), derived from the
# MS41.2 1406464 program and reporting the ECU-ID string SHINDE1
# (research/ms41-data.md §1.1). NOT a factory BMW variant. SCRAPED, UNVERIFIED.
#
# The BimmerStein logger XML lists SHINDE1 jointly with 1406464 on every channel, so
# the RAM map equals MS41.2's. What SHINDE1 adds, and why it gets its own profile
# instead of sharing ms41.2: the MS41.3-only wideband channels (BS_WB_AFR 0xE800,
# BS_WB_TARGET 0xE811), which do not exist on stock MS41.2 firmware.
#
# Not encoded: BS_WB_INPUT (0xFA9A) — a runtime-selected ADC pointer that aliases the
# front O2 B1 address already present here, so it would be a duplicate address under a
# second name. Also not encoded: the ignition-cut / launch-control calibration channels
# at 0x12A65+/0x147E0+ — those are flash calibration bytes, not live RAM telemetry.
#
# Scaling conventions (same as the other shipped profiles, research/ms41-data.md §7):
# RAM reads via DS2 cmd 0x06 are little-endian; 10-bit ADC channels are
# (x & 0x3FF) * 5 / 1023 V. Coolant/IAT use the RAM scaling 0.747x-48, NOT the
# 0x0B 03 group-read scaling. Nothing here has been checked on a car.


[profile]
id = "ms41.3-shinde1"
description = "MS41.3 community firmware (SS1v2, MS41.2-derived) — ECU ID SHINDE1 (unverified)"
match_hw = ["SHINDE1"]

[[param]]
name = "rpm"
core = true
label = "Engine RPM"
unit = "rpm"
addr = 0xDA2A
size = 2
formula = "x"
source = "BimmerStein-ECU-Tool logger_definitions/'BimmerStein MS41 Logger Definitions.xml' L95 ecuparam P8, ecu id list containing SHINDE1 (https://github.com/CAATZ/BimmerStein-ECU-Tool); research/profile-scrape.md"
verified = false

[[param]]
name = "maf"
core = true
label = "Mass air flow"
unit = "kg/h"
addr = 0xDA34
size = 2
formula = "x * 0.25"
