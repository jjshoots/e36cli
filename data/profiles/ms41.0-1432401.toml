# MS41.0 family, ECU ID 1432401 — recognised by MS41 tooling as MS41.0
# (BimmerStein ms41.py L93 _PROG_ECU_ID_MAP, gui.py L835). SCRAPED, UNVERIFIED.
#
# Two sources, both keyed explicitly to 1432401:
#  - logger XML: the common block (ECU-ID list includes 1432401).
#  - ds2.py _BATCH_ECU_ADDRS['1432401']: the 8 variant-specific addresses
#    (tps, lt_b1, lt_b2, st_b1_hi, st_b2_hi, injector_pw, engine_load, battery).
#    These happen to equal the 1429861 column, but they are listed for 1432401 in
#    its own right — not interpolated here.
# Note the ST trims: ds2.py's batch table stores the HIGH BYTE ONLY at ST_addr+1
# (0xED5C+1 / 0xED96+1), scaled (x-128)*100/256. The full 16-bit ST addresses are
# documented for 1429861 but NOT for 1432401, so the high-byte form is what ships.
# Additive trims, lambda-regulation flags and O2 heater duties are absent: the
# sources list those for 1429861 only.
#
# Scaling conventions (same as the other shipped profiles, research/ms41-data.md §7):
# RAM reads via DS2 cmd 0x06 are little-endian; 10-bit ADC channels are
# (x & 0x3FF) * 5 / 1023 V. Coolant/IAT use the RAM scaling 0.747x-48, NOT the
# 0x0B 03 group-read scaling. Nothing here has been checked on a car.


[profile]
id = "ms41.0-1432401"
description = "MS41.0 family — ECU ID 1432401 (unverified)"
match_hw = ["1432401"]

[[param]]
name = "rpm"
core = true
label = "Engine RPM"
unit = "rpm"
addr = 0xDA2A
size = 2
formula = "x"
source = "BimmerStein-ECU-Tool logger_definitions/'BimmerStein MS41 Logger Definitions.xml' L95 ecuparam P8, ecu id list containing 1432401 (https://github.com/CAATZ/BimmerStein-ECU-Tool); research/profile-scrape.md"
verified = false

[[param]]
name = "maf"
core = true
label = "Mass air flow"
unit = "kg/h"
addr = 0xDA34
size = 2
formula = "x * 0.25"
source = "BimmerStein-ECU-Tool logger_definitions/'BimmerStein MS41 Logger Definitions.xml' L99 ecuparam P12, ecu id list containing 1432401 (https://github.com/CAATZ/BimmerStein-ECU-Tool); research/profile-scrape.md"
