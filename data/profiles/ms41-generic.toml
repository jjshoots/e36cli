# MS41 generic fallback — ONLY params whose addresses agree across every
# documented MS41 ECU ID (research/ms41-data.md §3.6.1). Used when the ident
# ECU ID matches no specific profile. Variant-specific params (trims, injector
# PW, load, battery) are intentionally absent: their addresses move.

[profile]
id = "ms41-generic"
description = "MS41 generic fallback (common RAM map only)"
match_hw = []
# ZB numbers (unused by matching; SP-Daten reference): []
# SW numbers (unused by matching): []

# --- common across all MS41 ECU IDs (research §3.6.1) ---

[[param]]
name = "rpm"
core = true
label = "Engine RPM"
unit = "rpm"
addr = 0xDA2A
size = 2
formula = "x"
source = "BimmerStein logger XML P8; research/ms41-data.md §3.6.1"
verified = true
verified_source = "tests/fixtures/car-live-once.jsonl (idle, 2026-10-25)"

[[param]]
name = "maf"
core = true
label = "Mass air flow"
unit = "kg/h"
addr = 0xDA34
size = 2
formula = "x * 0.25"
source = "BimmerStein logger XML P12; research/ms41-data.md §3.6.1"
verified = true
verified_source = "tests/fixtures/car-live-once.jsonl (idle, 2026-10-25)"

[[param]]
name = "idle_valve"
label = "Idle valve pos"
unit = "%"
addr = 0xDA36
size = 2
signed = true
formula = "x * 0.00153"
source = "BimmerStein logger XML E9; research/ms41-data.md §3.6.1"
verified = false

[[param]]
name = "iat"
core = true
label = "Intake air temp"
unit = "°C"
addr = 0xDA50
size = 1
formula = "x * 0.747 - 48"
source = "BimmerStein logger XML P11; cross-checked vs DTC freeze-frame 0.7471x-48; research §3.6.1"
verified = true
verified_source = "tests/fixtures/car-live-once.jsonl (idle, 2026-10-25)"

[[param]]
name = "evap_duty"
label = "EVAP purge duty"
unit = "%"
addr = 0xDA56
size = 1
formula = "x * 100 / 255"
source = "BimmerStein logger XML; research/ms41-data.md §3.6.1"
verified = false

[[param]]
name = "coolant_temp"
core = true
label = "Coolant temp"
unit = "°C"
addr = 0xDA5A
size = 1
formula = "x * 0.747 - 48"
source = "BimmerStein logger XML P2; cross-checked vs DTC freeze-frame scaling; research §3.6.1"
verified = true
verified_source = "tests/fixtures/car-live-once.jsonl (idle, 2026-10-25)"

[[param]]
name = "vss"
core = true
label = "Vehicle speed"
unit = "km/h"
addr = 0xDA63
size = 1
formula = "x"
source = "BimmerStein logger XML P9; research/ms41-data.md §3.6.1"
verified = true
verified_source = "tests/fixtures/car-live-once.jsonl (idle, 2026-10-25)"

# Not verified: the 2026-10-25 "verification" on ECU 1429373 read a value
# that is static there (research/session3-coldstart.md §4.1).
[[param]]
name = "ignition_advance"
core = true
label = "Ignition advance"
unit = "°"
addr = 0xE989
size = 1
formula = "0.373 * x - 23.6"
source = "BimmerStein logger XML P10; research/ms41-data.md §3.6.1"
verified = false

[[param]]
name = "knock_retard"
label = "Knock retard (current)"
unit = "°"
addr = 0xE98D
size = 1
formula = "(x - 128) * 0.375"
source = "BimmerStein logger XML E217; research/ms41-data.md §3.6.1"
verified = false

[[param]]
name = "knock_retard_global"
