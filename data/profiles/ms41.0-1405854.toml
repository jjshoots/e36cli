core = true
label = "Vehicle speed"
unit = "km/h"
addr = 0xDA63
size = 1
formula = "x"
source = "BimmerStein-ECU-Tool logger_definitions/'BimmerStein MS41 Logger Definitions.xml' L115 ecuparam P9, ecu id list containing 1405854 (https://github.com/CAATZ/BimmerStein-ECU-Tool); research/profile-scrape.md"
verified = false

[[param]]
