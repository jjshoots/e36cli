# MS41.0 family, ECU ID 1405854 — an MS41 ECU-ID string recognised by MS41 tooling
# but absent from the SP-Daten S11 Zusbauvorschrift tables (research/ms41-data.md §1.2).
# SCRAPED, UNVERIFIED. Only the channels the BimmerStein logger XML explicitly lists
# for ECU ID 1405854 are encoded: the common block. Throttle position (0xE8D0),
# injector PW, fuel trims, engine load and battery voltage are deliberately ABSENT —
# the XML does not list them for this ECU ID and those addresses move between variants.
#
# Scaling conventions (same as the other shipped profiles, research/ms41-data.md §7):
# RAM reads via DS2 cmd 0x06 are little-endian; 10-bit ADC channels are
# (x & 0x3FF) * 5 / 1023 V. Coolant/IAT use the RAM scaling 0.747x-48, NOT the
# 0x0B 03 group-read scaling. Nothing here has been checked on a car.


[profile]
id = "ms41.0-1405854"
description = "MS41.0 family — ECU ID 1405854, common RAM map only (unverified)"
match_hw = ["1405854"]

[[param]]
name = "rpm"
core = true
label = "Engine RPM"
unit = "rpm"
addr = 0xDA2A
size = 2
formula = "x"
source = "BimmerStein-ECU-Tool logger_definitions/'BimmerStein MS41 Logger Definitions.xml' L95 ecuparam P8, ecu id list containing 1405854 (https://github.com/CAATZ/BimmerStein-ECU-Tool); research/profile-scrape.md"
verified = false

[[param]]
name = "maf"
core = true
label = "Mass air flow"
unit = "kg/h"
addr = 0xDA34
size = 2
formula = "x * 0.25"
source = "BimmerStein-ECU-Tool logger_definitions/'BimmerStein MS41 Logger Definitions.xml' L99 ecuparam P12, ecu id list containing 1405854 (https://github.com/CAATZ/BimmerStein-ECU-Tool); research/profile-scrape.md"
verified = false

[[param]]
name = "idle_valve"
label = "Idle valve pos"
unit = "%"
addr = 0xDA36
size = 2
signed = true
formula = "x * 0.00153"
source = "BimmerStein-ECU-Tool logger_definitions/'BimmerStein MS41 Logger Definitions.xml' L103 ecuparam E9, ecu id list containing 1405854 (https://github.com/CAATZ/BimmerStein-ECU-Tool); research/profile-scrape.md"
verified = false

[[param]]
name = "iat"
core = true
label = "Intake air temp"
unit = "°C"
addr = 0xDA50
size = 1
formula = "x * 0.747 - 48"
source = "BimmerStein-ECU-Tool logger_definitions/'BimmerStein MS41 Logger Definitions.xml' L107 ecuparam P11, ecu id list containing 1405854 (https://github.com/CAATZ/BimmerStein-ECU-Tool); research/profile-scrape.md"
verified = false

[[param]]
name = "evap_duty"
label = "EVAP purge duty"
unit = "%"
addr = 0xDA56
size = 1
formula = "x * 100 / 255"
source = "BimmerStein-ECU-Tool logger_definitions/'BimmerStein MS41 Logger Definitions.xml' L207 ecuparam BS_STD_EVAP_PURGE, ecu id list containing 1405854 (https://github.com/CAATZ/BimmerStein-ECU-Tool); research/profile-scrape.md"
verified = false

[[param]]
name = "coolant_temp"
core = true
label = "Coolant temp"
unit = "°C"
addr = 0xDA5A
size = 1
formula = "x * 0.747 - 48"
source = "BimmerStein-ECU-Tool logger_definitions/'BimmerStein MS41 Logger Definitions.xml' L111 ecuparam P2, ecu id list containing 1405854 (https://github.com/CAATZ/BimmerStein-ECU-Tool); research/profile-scrape.md"
verified = false

[[param]]
