# MS41.0 family, ECU ID 1438137 — note this is an SP-Daten SW-NR (1438137DA), not a
# HW-NR, but BimmerStein's tooling keys on it as an ECU-ID string in the same namespace
# (research/ms41-data.md §1.2 and §9.5). SCRAPED, UNVERIFIED.
#
# 1438137 is NOT in the logger XML's ECU-ID lists, so the common block here is sourced
# from ds2.py's batch setup frame instead, whose shared entries are explicitly stated to
# hold on every _BATCH_ECU_ADDRS key (ds2.py L772). Scalings come from the logger XML
# ecuparam that owns each address. The 8 variant-specific addresses come from
# _BATCH_ECU_ADDRS['1438137'] (ds2.py L788).
#
# ST trims are the high-byte-only form (ST_addr+1, 1 byte) — that is what the source
# lists for this ID; no full 16-bit ST address is documented for 1438137.
#
# Scaling conventions (same as the other shipped profiles, research/ms41-data.md §7):
# RAM reads via DS2 cmd 0x06 are little-endian; 10-bit ADC channels are
# (x & 0x3FF) * 5 / 1023 V. Coolant/IAT use the RAM scaling 0.747x-48, NOT the
# 0x0B 03 group-read scaling. Nothing here has been checked on a car.


[profile]
id = "ms41.0-1438137"
description = "MS41.0 family — ECU ID/SW-NR 1438137 (unverified)"
match_hw = ["1438137"]

[[param]]
name = "rpm"
core = true
label = "Engine RPM"
unit = "rpm"
addr = 0xDA2A
size = 2
formula = "x"
source = "BimmerStein-ECU-Tool ds2.py L815 batch setup frame, entry 6, 2b Engine RPM — shared across every _BATCH_ECU_ADDRS key including 1438137 (ds2.py L772 states: Entries 0-4, 6-13, 18-23 are shared, same address on every MS41); scaling from logger XML P8 (https://github.com/CAATZ/BimmerStein-ECU-Tool); research/profile-scrape.md"
verified = false

