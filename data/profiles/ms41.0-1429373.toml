# --- variant-specific, established by live RAM probe 2026-10-25 ---
# (research/1429373-probe.md; raw data research/data/1429373-*.json)

[[param]]
name = "inj_pw"
label = "Injector PW"
unit = "ms"
addr = 0xECBC
size = 2
formula = "x * 0.00534"
source = "live RAM probe 2026-10-25 (= 1429861 addr); 2.67-2.78 ms at warm idle, 8/8 rounds"
verified = false

[[param]]
name = "stft_b1"
core = true
label = "Short trim B1"
unit = "%"
addr = 0xED5C
size = 2
formula = "(x - 32768) * 100 / 65535"
source = "live RAM probe 2026-10-25 (= 1429861 addr); frozen at exactly 0.00% = bank 1 open loop (dead B1 sensor), diagnostic fingerprint"
verified = false

[[param]]
name = "stft_b2"
core = true
label = "Short trim B2"
unit = "%"
addr = 0xED96
size = 2
formula = "(x - 32768) * 100 / 65535"
source = "live RAM probe 2026-10-25 (= 1429861 addr); actively regulating -2.25..-5.9% at idle, every sample distinct"
verified = false

# LTFT: addresses behave correctly (B1 static at raw 4321 with lambda B1 dead;
# B2 slowly adapting 4394-4525) but the DOCUMENTED (x-32768) scaling is wrong
# for this ECU (gives -43%). Scaling below is the x/4096-as-factor hypothesis
# (raw 4321 -> +5.5%); LOW confidence on scaling, HIGH on address.
[[param]]
name = "ltft_b1"
label = "Long trim B1"
unit = "%"
addr = 0xED6E
size = 2
formula = "x * 0.0244140625 - 100"
source = "live RAM probe 2026-10-25; addr = 1429861, scaling hypothesis x/4096 factor"
verified = false

[[param]]
name = "ltft_b2"
label = "Long trim B2"
unit = "%"
addr = 0xEDA8
size = 2
formula = "x * 0.0244140625 - 100"
source = "live RAM probe 2026-10-25; addr = 1429861, scaling hypothesis x/4096 factor"
verified = false

# Additive trims: B1 frozen at raw 0 (open loop), B2 live at raw 66-75. The
# documented 0x8000-midpoint scaling is wrong here; treating raw as unsigned
# x0.00534 ms (B2 ~ +0.36 ms). LOW confidence scaling, HIGH address.
[[param]]
name = "add_b1"
label = "Additive trim B1"
unit = "ms"
addr = 0xED66
size = 2
formula = "x * 0.00534"
source = "live RAM probe 2026-10-25; addr = 1429861, scaling hypothesis unsigned ms"
verified = false

[[param]]
name = "add_b2"
label = "Additive trim B2"
unit = "ms"
addr = 0xEDA0
size = 2
formula = "x * 0.00534"
source = "live RAM probe 2026-10-25; addr = 1429861, scaling hypothesis unsigned ms"
verified = false

# Lambda status bytes: constant 0x02 (B1, open loop) / 0x01 (B2, closed loop)
# through all rounds. Hypothesis: bit0 = closed-loop active (doc says bit3 on
# other variants — does not match here). Raw bits exposed.
[[param]]
name = "lambda_bits_b1"
label = "Lambda status B1"
unit = "bits"
addr = 0xED58
size = 1
formula = "x"
source = "live RAM probe 2026-10-25; addr = 1429861 lambda-active byte"
verified = false

[[param]]
name = "lambda_bits_b2"
label = "Lambda status B2"
unit = "bits"
addr = 0xED92
size = 1
formula = "x"
source = "live RAM probe 2026-10-25; addr = 1429861 lambda-active byte"
verified = false

[[param]]
name = "load"
label = "Engine load"
unit = "mg/stroke"
addr = 0xFAFC
size = 2
formula = "x * 0.021195"
source = "live RAM probe 2026-10-25 (= 1429861 addr); raw 51-54 stable at idle; scaling per doc, plausibility of units uncertain"
verified = false

# Battery: 1429861 documents 0xFB47; on this ECU the tracking byte is 0xFB45
# (doc addr - 2). Read 13.97-14.38 V with alternator ripple across 15 samples
# at running idle; 0xFAB5 tracks near-identically (filtered copy? alternate).
[[param]]
name = "battery"
core = true
label = "Battery voltage"
unit = "V"
addr = 0xFB45
size = 1
formula = "x * 0.10196"
source = "live RAM probe 2026-10-25, signature scan + 20-round validation"
verified = true
verified_source = "research/data/1429373-validate-rounds.json + tests/fixtures/car-ram-dump.jsonl (running idle, 2026-10-25)"
