# MS41.0 family, ECU ID 1429373 — Euro M52, early production (this car: built 04/96,
# SW index 59 => MS41.0 per research/ms41-data.md §1.3; ident captured in
# tests/fixtures/car-ident.jsonl on 2026-10-25).
#
# Params: the §3.6.1 common set, PLUS variant-specific addresses established by
# the 2026-10-25 live RAM probe of this exact car (research/1429373-probe.md):
# 3 full window sweeps + 20-round re-read validation at warm idle. Headline:
# 1429373 uses the SAME trim-block addresses as 1429861 (the sibling Euro
# MS41.0), confirmed by a bank-asymmetry fingerprint (STFT B1 frozen at exactly
# 0.00% — dead B1 O2 sensor, open loop — while STFT B2 actively regulated
# −2…−6%). Battery is at 1429861's address −2 (0xFB45). Documented *scalings*
# for LTFT/additive do NOT match this ECU; hypotheses are noted per-param.
# Still not found: runtime cut, launch speed, O2 heater duties.
# (Knock-adaptation *calibration* axes for 1429373 exist at 0x12144/0x12117 —
# calibration-side, not live params.) tps (0xE8D0) is address-invariant across
# every documented variant and read plausibly on this car.
#
# Dashboard core = the generic 8 + stft_b1/b2 + battery (matches ms41.1 core).
[profile]
id = "ms41.0-1429373"
description = "MS41.0 (Euro M52) — ECU ID 1429373"
match_hw = ["1429373"]

# --- common across all MS41 ECU IDs (research §3.6.1) ---

[[param]]
name = "rpm"
core = true
label = "Engine RPM"
unit = "rpm"
addr = 0xDA2A
size = 2
formula = "x"
source = "BimmerStein logger XML P8; research/ms41-data.md §3.6.1"
verified = true
verified_source = "tests/fixtures/car-live-once.jsonl (idle, 2026-10-25)"

[[param]]
name = "maf"
core = true
label = "Mass air flow"
unit = "kg/h"
addr = 0xDA34
size = 2
formula = "x * 0.25"
source = "BimmerStein logger XML P12; research/ms41-data.md §3.6.1"
