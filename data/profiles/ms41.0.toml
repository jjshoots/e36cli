unit = "°"
addr = 0xE9D9
size = 1
formula = "(x - 128) * 0.375"
source = "BimmerStein logger XML E24; research/ms41-data.md §3.6.1"
verified = false

[[param]]
name = "vanos_angle"
label = "VANOS angle"
unit = "°"
addr = 0xE9E6
size = 1
formula = "x * 0.3745"
source = "BimmerStein logger XML E11; research/ms41-data.md §3.6.1"
verified = false

[[param]]
name = "tps"
label = "Throttle position"
unit = "%"
addr = 0xE8D0
size = 1
formula = "x * 100 / 255"
source = "BimmerStein logger XML P13; research/ms41-data.md §3.6.2"
verified = false

[[param]]
name = "tps_volts"
label = "TPS voltage"
unit = "V"
