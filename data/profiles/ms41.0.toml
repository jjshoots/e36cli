# MS41.0 — Euro/RoW M52 (E36/E39/E38/Z3 Euro, 323ti, Defender 2.8i).
# Addresses: BimmerStein MS41 Logger Definitions XML, column ECU-ID 1429861
# (https://github.com/CAATZ/BimmerStein-ECU-Tool), restated via research/ms41-data.md §3.6.
# All RAM reads via DS2 cmd 0x06 are little-endian. verified=false until checked on the car.
#
# Known scaling conflicts (research/ms41-data.md §7):
# - Coolant: RAM 0xDA5A uses 0.747x-48 (matches DTC freeze-frame 0.7471x-48); the 0x0B 03
#   group read instead encodes coolant as 108-0.45x. Do NOT cross-apply — this profile is
#   RAM-read scaling only.
# - ADC volts/bit: one capture gives 0.0193, BMW freeze-frame table 0.0196 (~5/255).
#   For 10-bit RAM ADC values we use (x & 0x3FF) * 5 / 1023 per the logger definition.

[profile]
id = "ms41.0"
description = "MS41.0 (Euro M52) — ECU ID 1429861/1427703/1440176"
match_hw = ["1427703", "1429861", "1440176", "7505858"]
# ZB numbers from SP-Daten MDS411 (R3VLimited archive, research §1.2)
match_zb = ["1429954", "1429955", "1438745", "1438790"]
match_sw = []

# --- common across all MS41 ECU IDs (research §3.6.1) ---

[[param]]
name = "rpm"
label = "Engine RPM"
unit = "rpm"
addr = 0xDA2A
size = 2
formula = "x"
source = "BimmerStein logger XML P8; research/ms41-data.md §3.6.1"
verified = false

[[param]]
name = "maf"
label = "Mass air flow"
unit = "kg/h"
addr = 0xDA34
size = 2
formula = "x * 0.25"
source = "BimmerStein logger XML P12; research/ms41-data.md §3.6.1"
verified = false

[[param]]
name = "idle_valve"
label = "Idle valve pos"
unit = "%"
addr = 0xDA36
size = 2
signed = true
formula = "x * 0.00153"
source = "BimmerStein logger XML E9; research/ms41-data.md §3.6.1"
verified = false

[[param]]
name = "iat"
label = "Intake air temp"
unit = "°C"
addr = 0xDA50
size = 1
formula = "x * 0.747 - 48"
source = "BimmerStein logger XML P11; cross-checked vs DTC freeze-frame 0.7471x-48; research §3.6.1"
verified = false

[[param]]
name = "evap_duty"
label = "EVAP purge duty"
unit = "%"
addr = 0xDA56
size = 1
formula = "x * 100 / 255"
source = "BimmerStein logger XML; research/ms41-data.md §3.6.1"
verified = false

[[param]]
name = "coolant_temp"
label = "Coolant temp"
unit = "°C"
addr = 0xDA5A
size = 1
formula = "x * 0.747 - 48"
source = "BimmerStein logger XML P2; cross-checked vs DTC freeze-frame scaling; research §3.6.1"
verified = false

[[param]]
name = "vss"
label = "Vehicle speed"
unit = "km/h"
addr = 0xDA63
size = 1
formula = "x"
source = "BimmerStein logger XML P9; research/ms41-data.md §3.6.1"
verified = false

[[param]]
name = "ignition_advance"
label = "Ignition advance"
unit = "°"
addr = 0xE989
size = 1
formula = "0.373 * x - 23.6"
source = "BimmerStein logger XML P10; research/ms41-data.md §3.6.1"
verified = false

[[param]]
name = "knock_retard"
label = "Knock retard (current)"
unit = "°"
addr = 0xE98D
size = 1
formula = "(x - 128) * 0.375"
source = "BimmerStein logger XML E217; research/ms41-data.md §3.6.1"
verified = false

[[param]]
name = "knock_retard_global"
