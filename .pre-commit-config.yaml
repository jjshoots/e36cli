# Install: uv run pre-commit install --install-hooks --hook-type pre-commit --hook-type pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=600"] # real-car capture fixtures are allowed to be chunky
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest (full suite, no hardware needed)
        entry: uv run pytest -q -x
        language: system
        pass_filenames: false
        stages: [pre-push]
