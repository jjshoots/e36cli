name: Release

# PyPI Trusted Publisher config expects this file name ("release.yml") and the
# "pypi" environment below. Do not rename either.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Full CI (lint, Python matrix, build + wheel smoke) as a reusable workflow.
  # Its `build` job uploads the `dist` artifact that `publish` ships.
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tag must equal pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $ver"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME == pyproject $ver"

  publish:
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing — no token/password
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Artifact must be exactly this version's sdist + wheel
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls -l dist/
          set -- dist/*
          test "$#" -eq 2
          test -f "dist/e36cli-$ver.tar.gz"
          set -- dist/e36cli-"$ver"-*.whl
          test -f "$1"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
