[project]
name = "e36cli"
version = "0.3.1"
description = "High-performance DS2 diagnostic CLI for BMW E36 (MS41) over K-line"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "jjshoots" }]
keywords = ["bmw", "e36", "ds2", "obd", "k-line", "ms41", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
e36 = "e36cli.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "mypy>=1.13",
    "types-pyserial>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e36cli"]

[tool.hatch.build.targets.wheel.force-include]
# Ship profile/DTC data inside the package; ms41.data_dir() falls back to the
# repo-root data/ tree during editable development.
"data" = "e36cli/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# STANDARDS.md STD-20: strict on src, enforced in CI (the `typecheck` job).
files = ["src"]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "SIM108",  # ternary rewrites often hurt readability in decode paths
    "SIM117",  # nested with-statements read better in transport/test code
    "B008",    # typer.Option in argument defaults is the typer idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "RUF012",  # mutable class attrs are fine on test fakes
]
